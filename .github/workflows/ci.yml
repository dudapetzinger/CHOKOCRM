name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: chokocrm, POSTGRES_PASSWORD: chokocrm, POSTGRES_DB: chokocrm_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chokocrm" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://chokocrm:chokocrm@localhost:5432/chokocrm_test
      JWT_SECRET: ci-secret
      AGENDA_JOB_ENABLED: "false"
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test -- --coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage/lcov.info
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  sonarcloud:
    # PR de fork não recebe SONAR_TOKEN: o job é pulado e o CI segue verde.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage
      # O jest grava `SF:src/...` (relativo a backend/); o scanner roda na raiz do repositório.
      - name: Reescrever caminhos do lcov relativos à raiz
        run: sed -i 's#^SF:#SF:backend/#' backend/coverage/lcov.info
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  workflows-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:latest

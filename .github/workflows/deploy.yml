name: Deploy
on:
  workflow_run: { workflows: [CI], types: [completed], branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
concurrency: producao
jobs:
  api:
    # workflow_run roda com secrets: só publica quando o CI do push na main passou
    # (um PR de fork com branch chamada `main` não dispara deploy). O job `smoke`
    # depende deste e é pulado junto com ele.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # O frontend vai no mesmo pacote: a API serve o build a partir de backend/web (WEB_DIR).
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - run: cp -r ../frontend/dist web
      # Pacote final: só dependências de produção (prisma e tsx ficam, para migrate deploy e seed).
      - run: npm ci --omit=dev
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend
  smoke:
    needs: api
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.VITE_API_URL }}
    steps:
      # O start da API roda migrations antes de ouvir a porta: espera até 2 min (24 x 5 s).
      - name: API responde em /health
        run: |
          : "${API_URL:?variable VITE_API_URL não definida}"
          for tentativa in $(seq 1 24); do
            if corpo=$(curl -fsS --max-time 10 "$API_URL/health") && grep -q '"status":"ok"' <<<"$corpo"; then
              echo "API saudável na tentativa $tentativa: $corpo"
              exit 0
            fi
            echo "Tentativa $tentativa/24 sem sucesso; nova tentativa em 5 s"
            sleep 5
          done
          echo "::error::A API não respondeu com status ok em $API_URL/health após 24 tentativas (2 min)"
          exit 1
      - name: Frontend responde na raiz e no fallback da SPA
        run: |
          tipo=$(curl -fsS --max-time 30 -o /dev/null -w '%{content_type}' "$API_URL/")
          echo "GET / → $tipo"
          if [[ "$tipo" != text/html* ]]; then
            echo "::error::$API_URL/ respondeu Content-Type '$tipo' em vez de text/html"
            exit 1
          fi
          codigo=$(curl -sSI --max-time 30 -H 'Accept: text/html' -o /dev/null -w '%{http_code}' "$API_URL/clientes/qualquer")
          echo "HEAD /clientes/qualquer (Accept: text/html) → $codigo"
          if [[ "$codigo" != 200 ]]; then
            echo "::error::O fallback da SPA respondeu $codigo em vez de 200 em $API_URL/clientes/qualquer"
            exit 1
          fi

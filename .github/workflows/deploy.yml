name: Deploy
on:
  workflow_run: { workflows: [CI], types: [completed], branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
concurrency: producao
jobs:
  api:
    # workflow_run roda com secrets: só publica quando o CI do push na main passou
    # (um PR de fork com branch chamada `main` não dispara deploy). Os jobs `web` e
    # `smoke` dependem deste e são pulados junto com ele.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run build
      # Pacote final: só dependências de produção (prisma e tsx ficam, para migrate deploy e seed).
      - run: npm ci --omit=dev
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend
  web:
    needs: api
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true
  smoke:
    needs: [api, web]
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.VITE_API_URL }}
      SWA_URL: ${{ vars.SWA_URL }}
    steps:
      # O start da API roda migrations antes de ouvir a porta: espera até 2 min (24 x 5 s).
      - name: API responde em /health
        run: |
          : "${API_URL:?variable VITE_API_URL não definida}"
          for tentativa in $(seq 1 24); do
            if corpo=$(curl -fsS --max-time 10 "$API_URL/health") && grep -q '"status":"ok"' <<<"$corpo"; then
              echo "API saudável na tentativa $tentativa: $corpo"
              exit 0
            fi
            echo "Tentativa $tentativa/24 sem sucesso; nova tentativa em 5 s"
            sleep 5
          done
          echo "::error::A API não respondeu com status ok em $API_URL/health após 24 tentativas (2 min)"
          exit 1
      - name: Frontend responde
        run: |
          : "${SWA_URL:?variable SWA_URL não definida}"
          curl -fsSI --max-time 30 "$SWA_URL"

# Analise estatica no SonarCloud, executada pelo job `sonarcloud` do CI.
# projectKey e organization seguem o padrao do SonarCloud para o repositorio;
# ajuste-os se a importacao do projeto gerar valores diferentes (passo 8 do wizard).
sonar.projectKey=dudapetzinger_CHOKOCRM
sonar.organization=dudapetzinger

sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.exclusions=**/node_modules/**,**/dist/**,backend/prisma/migrations/**,docs/prototipo/**,frontend/src/test/**,frontend/coverage/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.sourceEncoding=UTF-8

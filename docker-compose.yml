services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chokocrm
      POSTGRES_PASSWORD: chokocrm
      POSTGRES_DB: chokocrm
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chokocrm"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: { context: ./backend, dockerfile: Dockerfile.dev }
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://chokocrm:chokocrm@db:5432/chokocrm
    ports: ["3000:3000"]
    volumes: ["./backend:/app", "/app/node_modules"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build: { context: ./frontend, dockerfile: Dockerfile.dev }
    environment:
      VITE_API_URL: http://localhost:3000
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    depends_on:
      - api
volumes:
  pgdata:

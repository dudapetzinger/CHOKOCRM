<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChokoCRM — Entrar</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div class="container">
  <main class="tela-login">

    <div class="marca">
      <p class="marca-logo">Choko<span>CRM</span></p>
      <p class="marca-slogan">Gestão de visitas para representantes comerciais</p>
    </div>

    <section class="card" aria-labelledby="titulo-login">
      <h1 id="titulo-login" class="card-titulo">Entrar</h1>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="nome@chokolaten.com.br" autocomplete="username">
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password">
      </div>

      <a class="btn-primario" href="clientes.html">Entrar</a>
    </section>

    <p class="rodape-prototipo">Protótipo navegável — Etapa 1</p>

  </main>
</div>
</body>
</html>
